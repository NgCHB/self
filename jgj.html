(function(){
  var DATA = window.TRACE_DATA;
  var total = DATA.length;
  var current = 0;
  var pagesEl = document.getElementById('pages');
  var pageLabel = document.getElementById('pagelabel');
  var progressFill = document.getElementById('progress-fill');
  var prevBtn = document.getElementById('prevbtn');
  var nextBtn = document.getElementById('nextbtn');
  var clearBtn = document.getElementById('clearbtn');
  var offlineBanner = document.getElementById('offline-banner');
  var SVGNS = 'http://www.w3.org/2000/svg';

  if (typeof HanziWriter === 'undefined') {
    offlineBanner.style.display = 'block';
  }

  var pageEls = [];
  var pageCells = [];   // array of svg elements per page (for clear-all)
  var builtPages = {};

  function buildCharCell(ch) {
    var svg = document.createElementNS(SVGNS, 'svg');
    svg.setAttribute('viewBox', '0 0 100 100');
    svg.setAttribute('class', 'cell');

    var gridG = document.createElementNS(SVGNS, 'g');
    function line(x1, y1, x2, y2, dash) {
      var l = document.createElementNS(SVGNS, 'line');
      l.setAttribute('x1', x1); l.setAttribute('y1', y1);
      l.setAttribute('x2', x2); l.setAttribute('y2', y2);
      l.setAttribute('stroke', '#d8c9ac');
      l.setAttribute('stroke-width', '0.6');
      if (dash) l.setAttribute('stroke-dasharray', dash);
      gridG.appendChild(l);
    }
    line(50, 2, 50, 98, '3,2');
    line(2, 50, 98, 50, '3,2');
    line(5, 5, 95, 95, '2,2');
    line(95, 5, 5, 95, '2,2');
    svg.appendChild(gridG);

    var charG = document.createElementNS(SVGNS, 'g');
    svg.appendChild(charG);

    if (typeof HanziWriter === 'undefined') {
      var txt0 = document.createElementNS(SVGNS, 'text');
      txt0.setAttribute('x', '50'); txt0.setAttribute('y', '62');
      txt0.setAttribute('text-anchor', 'middle');
      txt0.setAttribute('font-size', '55');
      txt0.setAttribute('fill', '#7a1f1f');
      txt0.textContent = ch;
      charG.appendChild(txt0);
      return svg;
    }

    HanziWriter.loadCharacterData(ch).then(function(data) {
      var td = HanziWriter.getScalingTransform(100, 100, 10);
      charG.setAttribute('transform', td.transform);

      var paths = [];
      data.strokes.forEach(function(d) {
        var p = document.createElementNS(SVGNS, 'path');
        p.setAttribute('d', d);
        p.setAttribute('class', 'stroke-path');
        p.setAttribute('vector-effect', 'non-scaling-stroke');
        charG.appendChild(p);
        paths.push(p);
      });

      var filled = paths.map(function(){ return false; });

      function pointCheck(clientX, clientY) {
        for (var i = 0; i < paths.length; i++) {
          if (filled[i]) continue;
          var ctm = paths[i].getScreenCTM();
          if (!ctm) continue;
          var pt = svg.createSVGPoint();
          pt.x = clientX; pt.y = clientY;
          var local = pt.matrixTransform(ctm.inverse());
          if (paths[i].isPointInFill(local)) {
            filled[i] = true;
            paths[i].classList.add('filled');
          }

      }

      var down = false;
      function handleDown(e) {
        down = true;
        try { svg.setPointerCapture(e.pointerId); } catch (err) {}

        e.preventDefault();
      }
      function handleMove(e) {
        if (!down) return;
        pointCheck(e.clientX, e.clientY);
        e.preventDefault();
      }
      function handleUp() { down = false; }

      svg.addEventListener('pointerdown', handleDown);
      svg.addEventListener('pointermove', handleMove);
      svg.addEventListener('pointerup', handleUp);
      svg.addEventListener('pointercancel', handleUp);

      svg._resetCell = function() {

      };
    }).catch(function() {
      var txt = document.createElementNS(SVGNS, 'text');
      txt.setAttribute('x', '50'); txt.setAttribute('y', '62');
      txt.setAttribute('text-anchor', 'middle');
      txt.setAttribute('font-size', '55');
      txt.setAttribute('fill', '#7a1f1f');
      txt.setAttribute('opacity', '0.5');
      txt.textContent = ch;
      charG.appendChild(txt);
    });

    return svg;
  }

  function buildPage(i) {
    if (builtPages[i]) return;
    builtPages[i] = true;

    var pageDiv = pageEls[i];
    var card = document.createElement('div');
    card.className = 'card';
    var row = document.createElement('div');
    row.className = 'row';

    var cellsForPage = [];
    var tokens = DATA[i];
    for (var j = 0; j < tokens.length; j++) {
      var ch = tokens[j][0];
      var isChar = tokens[j][1];
      if (isChar) {
        var wrap = document.createElement('div');
        wrap.className = 'cell-wrap';
        var svgCell = buildCharCell(ch);
        wrap.appendChild(svgCell);
        row.appendChild(wrap);
        cellsForPage.push(svgCell);
      } else {
        var pc = document.createElement('div');
        pc.className = 'punct-cell';
        pc.textContent = ch;
        row.appendChild(pc);
      }
    }
    card.appendChild(row);
    pageDiv.appendChild(card);
    pageCells[i] = cellsForPage;
  }

  for (var i = 0; i < total; i++) {
    var pageDiv = document.createElement('div');
    pageDiv.className = 'page';
    pagesEl.appendChild(pageDiv);
    pageEls.push(pageDiv);
    pageCells.push([]);
  }

    }

    progressFill.style.width = (((current + 1) / total) * 100) + '%';

    nextBtn.classList.toggle('disabled', current === total - 1);
    if (current + 1 < total) buildPage(current + 1);
    if (current - 1 >= 0) buildPage(current - 1);
  }

  function next() { if (current < total - 1) render(current + 1); }
  function prev() { if (current > 0) render(current - 1); }

  prevBtn.addEventListener('click', prev);
  nextBtn.addEventListener('click', next);

  clearBtn.addEventListener('click', function() {
    var cells = pageCells[current] || [];
    cells.forEach(function(svg) {
      if (svg._resetCell) svg._resetCell();
    });
  });

  var touchStartX = null, touchStartY = null;
  function isInsideCell(el) {
    while (el && el !== document.body) {
      if (el.classList && el.classList.contains('cell')) return true;
      if (el.tagName === 'path' || el.tagName === 'line') return true;
      el = el.parentElement || el.parentNode;
    }
    return false;
  }
  function swipeStart(e) {
    var t = e.touches ? e.touches[0] : e;
    if (isInsideCell(e.target)) { touchStartX = null; return; }
    touchStartX = t.clientX;
    touchStartY = t.clientY;
  }
  function swipeEnd(e) {
    if (touchStartX === null) return;
    var t = e.changedTouches ? e.changedTouches[0] : e;
    var dx = t.clientX - touchStartX;

    }
    touchStartX = null;
  }
  document.getElementById('app').addEventListener('touchstart', swipeStart, {passive:true});
  document.getElementById('app').addEventListener('touchend', swipeEnd, {passive:true});

  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight') next();
    if (e.key === 'ArrowLeft') prev();
  });

  function start() { render(0); }

  if (typeof HanziWriter === 'undefined') {
    setTimeout(function() {
      if (typeof HanziWriter === 'undefined') {
        offlineBanner.style.display = 'block';
      }
      start();
    }, 1500);
  } else {
    start();
  }
})();
