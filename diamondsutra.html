<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>金刚经 · 注音版</title>
<style>
  :root {
    --gold: #b8935a;
    --gold-light: #d9b98a;
    --ink: #2b2420;
    --paper: #faf6ee;
    --paper-2: #f2ead8;
    --accent: #8a2c2c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: radial-gradient(ellipse at top, #3a2f28 0%, #1c1712 70%);
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Serif SC", "Songti SC", serif;
    touch-action: manipulation;
  }
  #app {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
  }
  #topbar {
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    padding: max(10px, env(safe-area-inset-top)) 16px 10px 16px;
    color: var(--gold-light);
    font-size: 13px;
    letter-spacing: 1px;
  }
  #title {
    font-size: 15px;
    color: var(--gold-light);
    opacity: 0.9;
  }
  #progress-wrap {
    flex: 0 0 auto;
    padding: 0 16px 8px 16px;
  }
  #progress-track {
    height: 3px; width: 100%;
    background: rgba(217,185,138,0.15);
    border-radius: 3px;
    overflow: hidden;
  }
  #progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--gold), var(--gold-light));
    transition: width 0.25s ease;
  }
  #stage {
    flex: 1 1 auto;
    position: relative;
    overflow: hidden;
  }
  .page {
    position: absolute; inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 22px;
    opacity: 0;
    transform: translateX(24px) scale(0.98);
    transition: opacity 0.28s ease, transform 0.32s ease;
    pointer-events: none;
  }
  .page.active {
    opacity: 1;
    transform: translateX(0) scale(1);
    pointer-events: auto;
  }
  .page.leaving-left {
    opacity: 0;
    transform: translateX(-24px) scale(0.98);
  }
  .card {
    background: linear-gradient(180deg, var(--paper) 0%, var(--paper-2) 100%);
    border-radius: 22px;
    padding: 34px 22px 30px 22px;
    width: 100%;
    max-width: 640px;
    max-height: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45), 0 0 0 1px rgba(184,147,90,0.25) inset;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
    background: linear-gradient(90deg, var(--gold), var(--accent), var(--gold));
  }
  .sentence {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-end;
    row-gap: 14px;
    column-gap: 2px;
    direction: ltr;
  }
  .glyph {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    line-height: 1;
  }
  .py {
    font-size: clamp(13px, 3.2vw, 18px);
    color: var(--accent);
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-weight: 600;
    margin-bottom: 4px;
    white-space: nowrap;
  }
  .hz {
    font-size: clamp(30px, 8.6vw, 50px);
    color: var(--ink);
    font-weight: 500;
  }
  .punct {
    font-size: clamp(30px, 8.6vw, 50px);
    color: var(--ink);
    opacity: 0.55;
    align-self: flex-end;
    padding-bottom: 2px;
  }
  #hint {
    position: absolute;
    bottom: 14px; left: 0; right: 0;
    text-align: center;
    font-size: 11px;
    color: rgba(255,255,255,0.35);
    letter-spacing: 1px;
    pointer-events: none;
  }
  #tapzones {
    position: absolute; inset: 0;
    display: flex;
    z-index: 5;
  }
  .zone { flex: 1; }
  #bottombar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 10px 16px max(14px, env(safe-area-inset-bottom)) 16px;
  }
  .navbtn {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: rgba(217,185,138,0.12);
    border: 1px solid rgba(217,185,138,0.3);
    color: var(--gold-light);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    user-select: none;
    -webkit-user-select: none;
  }
  .navbtn:active { background: rgba(217,185,138,0.28); }
  .navbtn.disabled { opacity: 0.25; }
  #pagelabel {
    color: var(--gold-light);
    font-size: 13px;
    min-width: 70px;
    text-align: center;
    letter-spacing: 0.5px;
    font-variant-numeric: tabular-nums;
  }
  #endcard {
    display: none;
    text-align: center;
    color: var(--ink);
  }
  #endcard h2 {
    font-size: 22px;
    margin: 0 0 10px 0;
    color: var(--accent);
  }
  #endcard p {
    font-size: 15px;
    line-height: 1.9;
    color: #5a4d3f;
    margin: 0;
  }
  #restartbtn {
    margin-top: 20px;
    padding: 10px 22px;
    border-radius: 999px;
    background: var(--accent);
    color: #f6e9d8;
    border: none;
    font-size: 14px;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div id="title">金刚般若波罗蜜经</div>
    <div id="pagelabel-top"></div>
  </div>
  <div id="progress-wrap">
    <div id="progress-track"><div id="progress-fill"></div></div>
  </div>
  <div id="stage">
    <div id="pages"></div>
    <div id="tapzones">
      <div class="zone" id="zone-prev"></div>
      <div class="zone" id="zone-next"></div>
    </div>
    <div id="hint">轻触左右翻页 · TAP TO TURN PAGE</div>
  </div>
  <div id="bottombar">
    <div class="navbtn" id="prevbtn">‹</div>
    <div id="pagelabel">1 / 1</div>
    <div class="navbtn" id="nextbtn">›</div>
  </div>
</div>
