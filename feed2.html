<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DailyFeed</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2315803d'/%3E%3Ccircle cx='10' cy='22' r='2.5' fill='white'/%3E%3Cpath d='M8 14a10 10 0 0 1 10 10M8 7a17 17 0 0 1 17 17' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1b1b1a;--mute:#6b6a65;--line:#e4e2db;--acc:#15803d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--card:#1e1e1c;--ink:#f0eee8;--mute:#9a978e;--line:#2e2d2a;--acc:#4ade80}}
:root[data-theme="dark"]{--bg:#141413;--card:#1e1e1c;--ink:#f0eee8;--mute:#9a978e;--line:#2e2d2a;--acc:#4ade80}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
h1{font:700 26px/1 Georgia,serif;margin:0;letter-spacing:-.5px}
h1 span{color:var(--acc)}
.hr{display:flex;gap:6px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 11px}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button:disabled{opacity:.5}
input,select{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);min-width:0}
.add{display:flex;gap:8px;margin-bottom:6px}
.add .u{flex:1}.add .c{width:110px}
.hint{font-size:12px;color:var(--mute);margin:0 0 12px}
.row{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.chip{white-space:nowrap;border-radius:99px;padding:4px 11px;font-size:13px;display:flex;gap:6px;align-items:center}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip i{font-style:normal;opacity:.65}
.chip .n{background:var(--acc);color:#fff;border-radius:99px;font-size:11px;padding:0 6px}
.chip.on .n{background:#fff;color:var(--acc)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:6px 0 12px}
.tab{border:0;border-radius:0;background:none;padding:8px 12px;color:var(--mute);border-bottom:2px solid transparent}
.tab.on{color:var(--ink);border-color:var(--acc);font-weight:600}
.tools{display:flex;gap:8px;margin-bottom:10px}
.tools input{flex:1}
.status{font-size:13px;color:var(--mute);margin:0 0 12px;min-height:18px}
.status.err{color:#dc2626}
.item{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;position:relative}
.item.read{opacity:.55}
.item:hover{border-color:var(--acc)}
.item img{width:84px;height:84px;object-fit:cover;border-radius:10px;flex:none;background:var(--line)}
.body{flex:1;min-width:0}
.meta{font-size:12px;color:var(--mute);display:flex;gap:8px;margin-bottom:3px;flex-wrap:wrap}
.meta b{color:var(--acc);font-weight:600}
.item h3{margin:0 0 4px;font-size:16px;line-height:1.3}
.item h3 a{color:inherit;text-decoration:none}
.item h3 a:hover{text-decoration:underline}
.item p{margin:0;font-size:13.5px;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.act{display:flex;flex-direction:column;gap:4px}
.act button{border:0;background:none;padding:2px 4px;font-size:18px;color:var(--mute);line-height:1}
.act button.on{color:var(--acc)}
.compact .item{padding:9px 12px}
.compact .item img,.compact .item p{display:none}
.compact .item h3{font-size:14.5px;margin:0}
.empty{text-align:center;padding:48px 16px;color:var(--mute);border:1px dashed var(--line);border-radius:14px}
details{margin-top:24px;font-size:13px;color:var(--mute)}
details label{display:block;margin-top:10px}
details input,details select{width:100%;margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Daily<span>Feed</span></h1>
    <div class="hr">
      <button id="theme" title="Toggle theme">◐</button>
      <button id="view" title="Compact view">☰</button>
      <button id="refresh">↻ Refresh</button>
    </div>
  </header>

  <div class="add">
    <input class="u" id="url" type="text" placeholder="Paste site or feed URLs…" autocapitalize="off" autocorrect="off">
    <input class="c" id="cat" type="text" placeholder="Category">
    <button class="pri" id="addBtn">Add</button>
  </div>
  <p class="hint">Paste several URLs at once (space, comma or new line separated). Category is optional.</p>

  <div class="row" id="cats"></div>
  <div class="row" id="chips"></div>

  <div class="tabs" id="tabs"></div>
  <div class="tools">
    <input id="q" type="search" placeholder="Search the feed…">
    <button id="markAll">✓ Mark all read</button>
  </div>
  <p class="status" id="status"></p>
  <div id="feed"></div>

  <details>
    <summary>Settings</summary>
    <label>CORS proxy (URL is appended, encoded)
      <input id="proxy" type="text"></label>
    <label>Auto-refresh
      <select id="auto"><option value="0">Off</option><option value="5">Every 5 min</option><option value="15">Every 15 min</option><option value="60">Every hour</option></select></label>
    <label>Sort
      <select id="sort"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="src">By source</option></select></label>
    <p><button id="restore">Restore starter sources</button> <button id="clear">Reset all data</button></p>
  </details>
</div>

<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var DP="https://api.allorigins.win/raw?url=";
  var S={sources:[],items:[],read:{},saved:{},proxy:DP,tab:"all",src:null,cat:null,sort:"new",auto:0,compact:false,theme:"",seeded:false};
  var timer=null;

  function load(){
    try{var d=JSON.parse(localStorage.getItem("dailyfeed")||"null");if(d)for(var k in d)S[k]=d[k]}catch(e){}
  }
  function save(){
    try{
      var keep=S.items.filter(function(i){return S.saved[id(i)]});
      var rest=S.items.filter(function(i){return !S.saved[id(i)]}).sort(function(a,b){return b.date-a.date}).slice(0,300);
      var o={};for(var k in S)o[k]=S[k];o.items=keep.concat(rest);
      localStorage.setItem("dailyfeed",JSON.stringify(o));
    }catch(e){}
  }
  var PRESETS=[
    ["JustinGuitar","🎸 Fingerstyle","https://www.justinguitar.com","https://www.justinguitar.com/feed.rss"],
    ["Acoustic Guitar","🎸 Acoustic guitar","https://acousticguitar.com","https://acousticguitar.com/feed/"],
    ["RSC Education","🧪 Chemistry education","https://edu.rsc.org","https://edu.rsc.org"],
    ["AI for Education","🤖 AI education","https://www.aiforeducation.io","https://www.aiforeducation.io"],
    ["Quanta Magazine","🔬 Science","https://www.quantamagazine.org","https://www.quantamagazine.org/feed/"],
    ["Chemistry World","🧪 Chemistry discoveries","https://www.chemistryworld.com","https://www.chemistryworld.com/413.rss"],
    ["Android Authority","📱 Android","https://www.androidauthority.com","https://www.androidauthority.com/feed/"],
    ["Farnam Street","🧠 Personal development","https://fs.blog","https://fs.blog/feed/"],
    ["Four Minute Books","📚 Books","https://fourminutebooks.com","https://fourminutebooks.com/feed/"],
    ["Ness Labs","🧠 Learning/thinking","https://nesslabs.com","https://nesslabs.com/feed"],
    ["The Buddhist Society","🪷 Buddhism","https://thebuddhistsociety.org","https://thebuddhistsociety.org"],
    ["UCLA Mindful","🧘 Meditation","https://www.uclahealth.org/programs/uclamindful","https://www.uclahealth.org/programs/uclamindful"],
    ["NHS Better Health","❤️ Health & wellbeing","https://www.nhs.uk/better-health/","https://www.nhs.uk/better-health/"]
  ];
  function seed(){
    PRESETS.forEach(function(p){
      var ex=S.sources.filter(function(s){return s.site===p[2]||s.url===p[3]})[0];
      if(ex){ex.feedUrl=p[3];ex.site=p[2];return}
      S.sources.push({url:p[3],feedUrl:p[3],site:p[2],name:p[0],cat:p[1]});
    });
    S.seeded=true;S.seedVer=3;save();
  }
  function id(i){return i.src+"|"+(i.link||i.title)}
  function status(t,err){var s=$("status");s.textContent=t||"";s.className="status"+(err?" err":"")}

  async function fetchT(u,ms){
    var c=new AbortController(),t=setTimeout(function(){c.abort()},ms||9000);
    try{return await fetch(u,{signal:c.signal})}finally{clearTimeout(t)}
  }
  async function getText(u){
    var tries=[u];
    [S.proxy,"https://corsproxy.io/?url=","https://api.codetabs.com/v1/proxy?quest=",DP].forEach(function(p){
      if(p&&tries.indexOf(p+encodeURIComponent(u))<0)tries.push(p+encodeURIComponent(u));
    });
    for(var i=0;i<tries.length;i++){
      try{var r=await fetchT(tries[i]);if(!r.ok)continue;var t=await r.text();if(t&&t.length>50)return t}catch(e){}
    }
    throw new Error("All fetch routes failed");
  }
  async function viaJson(s){
    var r=await fetchT("https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent(s.feedUrl),12000);
    var j=await r.json();
    if(j.status!=="ok"||!j.items||!j.items.length)throw 0;
    return j.items.slice(0,30).map(function(i){
      var raw=i.description||i.content||"";
      return{src:s.url,source:s.name,cat:s.cat||"",title:(i.title||"").trim(),link:i.link||"",date:Date.parse((i.pubDate||"").replace(" ","T")+"Z")||Date.now(),sum:clean(raw),img:i.thumbnail||(i.enclosure&&i.enclosure.link)||"",mins:Math.max(1,Math.round(raw.replace(/<[^>]*>/g," ").split(/\s+/).length/220))};
    });
  }
  async function fetchItems(s){
    try{var p=parse(await getText(s.feedUrl),s);if(p.items.length)return p.items}catch(e){}
    if(s.site){try{var r=await resolveFeed(s.site);s.feedUrl=r.feedUrl;var p2=parse(r.text,s);if(p2.items.length)return p2.items}catch(e){}}
    return await viaJson(s);
  }
  function isFeed(t){return /<(rss|feed|rdf:RDF)[\s>]/i.test(t.slice(0,2000))}
  function norm(u){u=u.trim();return /^https?:\/\//i.test(u)?u:"https://"+u}

  async function resolveFeed(input){
    var u=norm(input),txt=await getText(u);
    if(isFeed(txt))return{feedUrl:u,text:txt};
    var doc=new DOMParser().parseFromString(txt,"text/html");
    var l=doc.querySelector('link[rel="alternate"][type*="rss"],link[rel="alternate"][type*="atom"]');
    if(l&&l.getAttribute("href")){var f=new URL(l.getAttribute("href"),u).href;return{feedUrl:f,text:await getText(f)}}
    var base=new URL(u).origin,p=["/feed","/feed/","/rss","/feed.xml","/rss.xml","/atom.xml","/index.xml","/blog/feed","/blog/rss.xml","/news/feed"],page="";
    for(var i=0;i<p.length;i++){try{var t=await getText(base+p[i]);if(isFeed(t))return{feedUrl:base+p[i],text:t};if(p[i]==="/rss")page=t}catch(e){}}
    if(page){
      var d2=new DOMParser().parseFromString(page,"text/html");
      var ls=Array.from(d2.querySelectorAll("a[href]")).map(function(a){return a.getAttribute("href")}).filter(function(h){return /\.rss(\?|$)|\/rss|\/feed/i.test(h)}).slice(0,6);
      for(var j=0;j<ls.length;j++){try{var fu=new URL(ls[j],base).href,t2=await getText(fu);if(isFeed(t2))return{feedUrl:fu,text:t2}}catch(e){}}
    }
    throw new Error("No feed found");
  }
  function clean(h){
    var d=new DOMParser().parseFromString(h||"","text/html");
    var t=(d.body.textContent||"").replace(/\s+/g," ").trim();
    return t.length>220?t.slice(0,217)+"…":t;
  }
  function parse(text,src){
    var x=new DOMParser().parseFromString(text,"text/xml");
    var title=(x.querySelector("channel > title, feed > title")||{}).textContent;
    var items=Array.from(x.querySelectorAll("item, entry")).slice(0,30).map(function(n){
      var g=function(s){var e=n.querySelector(s);return e?e.textContent:""};
      var link=g("link"),le=n.querySelector("link[href]");if(le)link=le.getAttribute("href");
      var d=new Date(g("pubDate")||g("published")||g("updated")||g("date")).getTime()||Date.now();
      var m=n.querySelector("enclosure[type^='image'],content[url],thumbnail");
      var raw=g("description")||g("summary")||g("content");
      var words=raw.replace(/<[^>]*>/g," ").split(/\s+/).length;
      return{src:src.url,source:src.name||title||src.url,cat:src.cat||"",title:g("title").trim(),link:link.trim(),date:d,sum:clean(raw),img:m?m.getAttribute("url")||"":"",mins:Math.max(1,Math.round(words/220))};
    });
    return{title:title,items:items};
  }
  function merge(src,fresh){
    var old=S.items.filter(function(i){return i.src===src.url&&S.saved[id(i)]&&!fresh.some(function(f){return id(f)===id(i)})});
    S.items=S.items.filter(function(i){return i.src!==src.url}).concat(fresh,old);
  }

  async function addOne(input,cat){
    try{
      var r=await resolveFeed(input);
      if(S.sources.some(function(s){return s.feedUrl===r.feedUrl}))return"dup";
      var src={url:r.feedUrl,feedUrl:r.feedUrl,name:"",cat:cat};
      var p=parse(r.text,src);
      src.name=(p.title||new URL(r.feedUrl).hostname).trim();
      p.items.forEach(function(i){i.source=src.name});
      S.sources.push(src);merge(src,p.items);return"ok";
    }catch(e){return"fail"}
  }
  async function addMany(text){
    var urls=text.split(/[\s,]+/).filter(Boolean),cat=$("cat").value.trim(),ok=0,fail=0;
    for(var i=0;i<urls.length;i++){status("Adding "+(i+1)+" of "+urls.length+"…");var r=await addOne(urls[i],cat);if(r==="ok")ok++;if(r==="fail")fail++}
    save();render();
    status(ok+" added"+(fail?", "+fail+" failed (check URL or proxy in Settings; try the demo to preview)":"."),fail&&!ok);
  }

  async function refresh(quiet){
    if(!S.sources.length){if(!quiet)status("Add a site first.");return}
    $("refresh").disabled=true;if(!quiet)status("Refreshing…");var fail=0;
    var queue=S.sources.filter(function(x){return !x.demo}),done=0;
    async function worker(){
      while(queue.length){
        var src=queue.shift();
        try{var its=await fetchItems(src);its.forEach(function(i){i.source=src.name});src.err=false;merge(src,its);save();render()}catch(e){fail++;src.err=true}
        done++;if(!quiet)status("Refreshing… "+done+" of "+(done+queue.length));
      }
    }
    await Promise.all([worker(),worker(),worker()]);
    save();render();$("refresh").disabled=false;
    status(fail?fail+" failed: "+S.sources.filter(function(x){return x.err}).map(function(x){return x.name}).join(", "):"Updated "+new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}),!!fail);
  }
  function setAuto(){clearInterval(timer);if(+S.auto)timer=setInterval(function(){refresh(true)},S.auto*6e4)}

  function demo(){
    var D=[["The Daily Byte","Tech",[["Why small teams ship faster than big ones","Smaller groups cut coordination costs, and it shows up in release cadence."],["A gentle introduction to local-first software","Local-first apps keep your data on your device and sync when they can."],["Notes on building a reading habit","Ten minutes a day beats a weekend binge."]]],
      ["Orbit Science","Science",[["New telescope image reveals a ring of young stars","Astronomers describe a faint halo around a nearby star-forming region."],["How deep-sea microbes survive without sunlight","Chemical energy powers entire ecosystems below 3,000 metres."],["The surprising maths of honeycomb","Why hexagons win: a short tour of efficient packing."]]],
      ["Kitchen Table","Food",[["One-pan lemon chicken for busy weeknights","Crisp skin, bright sauce, and only one dish to wash."],["Sourdough troubleshooting: dense crumb?","Common causes of a tight crumb and how to fix them."],["Seasonal produce guide for October","What to buy now, and what to do with it."]]]];
    D.forEach(function(d,si){
      var u="demo://"+si;if(S.sources.some(function(s){return s.url===u}))return;
      S.sources.push({url:u,feedUrl:u,name:d[0],cat:d[1],demo:true});
      d[2].forEach(function(a,k){S.items.push({src:u,source:d[0],cat:d[1],title:a[0],link:"",date:Date.now()-(si*3+k)*18e6,sum:a[1],img:"",mins:2+k})});
    });
    save();render();status("Demo sources loaded. Add real sites above.");
  }

  function ago(t){
    var m=Math.max(1,Math.round((Date.now()-t)/6e4));if(m<60)return m+"m ago";
    var h=Math.round(m/60);if(h<24)return h+"h ago";var d=Math.round(h/24);return d<30?d+"d ago":new Date(t).toLocaleDateString();
  }
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
  function unread(f){return S.items.filter(function(i){return !S.read[id(i)]&&(!f||f(i))}).length}

  function render(){
    document.documentElement.setAttribute("data-theme",S.theme||"");
    $("feed").className=S.compact?"compact":"";
    // categories
    var cats=[];S.sources.forEach(function(s){if(s.cat&&cats.indexOf(s.cat)<0)cats.push(s.cat)});
    var cr=$("cats");cr.innerHTML="";cr.style.display=cats.length?"flex":"none";
    cats.forEach(function(c){
      var b=el("button","chip"+(S.cat===c?" on":""),"# "+c);
      b.onclick=function(){S.cat=S.cat===c?null:c;S.src=null;render()};cr.appendChild(b);
    });
    // sources
    var ch=$("chips");ch.innerHTML="";
    S.sources.filter(function(s){return !S.cat||s.cat===S.cat}).forEach(function(s){
      var c=el("button","chip"+(S.src===s.url?" on":""),(s.err?"⚠ ":"")+s.name);if(s.err)c.title="Could not load this feed";
      var n=unread(function(i){return i.src===s.url});if(n)c.appendChild(el("span","n",n));
      c.onclick=function(){S.src=S.src===s.url?null:s.url;render()};
      var x=el("i",null,"✕");x.title="Remove";
      x.onclick=function(ev){ev.stopPropagation();S.sources=S.sources.filter(function(z){return z!==s});S.items=S.items.filter(function(i){return i.src!==s.url});if(S.src===s.url)S.src=null;save();render()};
      c.appendChild(x);ch.appendChild(c);
    });
    // tabs
    var tb=$("tabs");tb.innerHTML="";
    var nSaved=S.items.filter(function(i){return S.saved[id(i)]}).length;
    [["all","All"],["unread","Unread ("+unread()+")"],["saved","Saved ("+nSaved+")"]].forEach(function(t){
      var b=el("button","tab"+(S.tab===t[0]?" on":""),t[1]);b.onclick=function(){S.tab=t[0];render()};tb.appendChild(b);
    });
    // list
    var q=$("q").value.toLowerCase();
    var list=S.items.filter(function(i){
      if(S.src&&i.src!==S.src)return false;
      if(S.cat&&i.cat!==S.cat)return false;
      if(S.tab==="unread"&&S.read[id(i)])return false;
      if(S.tab==="saved"&&!S.saved[id(i)])return false;
      return !q||(i.title+" "+i.sum+" "+i.source).toLowerCase().indexOf(q)>-1;
    }).sort(function(a,b){
      if(S.sort==="old")return a.date-b.date;
      if(S.sort==="src")return a.source.localeCompare(b.source)||b.date-a.date;
      return b.date-a.date;
    });
    var f=$("feed");f.innerHTML="";
    if(!list.length){
      var e=el("div","empty");
      e.appendChild(el("p",null,!S.items.length?(S.sources.length?"No posts loaded yet. Tap Refresh to fetch your sources.":"Your feed is empty. Add a website above to start."):S.tab==="saved"?"Nothing saved yet. Tap ☆ on a post.":S.tab==="unread"?"You're all caught up.":"No posts match."));
      if(!S.items.length){var b=el("button","pri","Load demo posts");b.onclick=demo;e.appendChild(b)}
      f.appendChild(e);return;
    }
    list.forEach(function(i){
      var k=id(i),card=el("div","item"+(S.read[k]?" read":""));
      if(i.img){var im=el("img");im.src=i.img;im.alt="";im.loading="lazy";im.onerror=function(){im.remove()};card.appendChild(im)}
      var b=el("div","body"),m=el("div","meta");
      m.appendChild(el("b",null,i.source));m.appendChild(el("span",null,ago(i.date)));
      if(i.mins)m.appendChild(el("span",null,i.mins+" min read"));
      var h=el("h3"),a=el("a",null,i.title);
      if(i.link){a.href=i.link;a.target="_blank";a.rel="noopener noreferrer"}
      a.onclick=function(){S.read[k]=1;save();card.classList.add("read");renderCounts()};
      h.appendChild(a);b.appendChild(m);b.appendChild(h);if(i.sum)b.appendChild(el("p",null,i.sum));
      var act=el("div","act");
      var st=el("button",S.saved[k]?"on":"",S.saved[k]?"★":"☆");st.title="Save";
      st.onclick=function(){if(S.saved[k])delete S.saved[k];else S.saved[k]=1;save();render()};
      var rd=el("button","",S.read[k]?"○":"●");rd.title=S.read[k]?"Mark unread":"Mark read";
      rd.onclick=function(){if(S.read[k])delete S.read[k];else S.read[k]=1;save();render()};
      act.appendChild(st);act.appendChild(rd);
      card.appendChild(b);card.appendChild(act);f.appendChild(card);
    });
  }
  function renderCounts(){var t=$("tabs").children[1];if(t)t.textContent="Unread ("+unread()+")"}

  load();
  $("proxy").value=S.proxy;$("auto").value=S.auto;$("sort").value=S.sort;
  $("proxy").onchange=function(){S.proxy=this.value.trim()||DP;save()};
  $("auto").onchange=function(){S.auto=+this.value;save();setAuto()};
  $("sort").onchange=function(){S.sort=this.value;save();render()};
  $("addBtn").onclick=function(){var v=$("url").value;if(v.trim()){$("url").value="";addMany(v)}};
  $("url").onkeydown=function(e){if(e.key==="Enter")$("addBtn").click()};
  $("q").oninput=render;
  $("refresh").onclick=function(){refresh()};
  $("theme").onclick=function(){var dark=S.theme?S.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;S.theme=dark?"light":"dark";save();render()};
  $("view").onclick=function(){S.compact=!S.compact;save();render()};
  $("markAll").onclick=function(){S.items.forEach(function(i){if((!S.src||i.src===S.src)&&(!S.cat||i.cat===S.cat))S.read[id(i)]=1});save();render();status("Marked as read.")};
  $("restore").onclick=function(){seed();render();refresh()};
  $("clear").onclick=function(){if(confirm("Remove all sources, saved posts and settings?")){try{localStorage.removeItem("dailyfeed")}catch(e){}S.sources=[];S.items=[];S.read={};S.saved={};S.src=S.cat=null;render();status("Reset.")}};
  var first=S.seedVer!==3;if(first)seed();
  setAuto();render();
  if(first||(S.sources.length&&!S.items.length))refresh();
})();
</script>
</body>
</html>
